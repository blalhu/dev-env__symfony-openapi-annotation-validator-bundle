framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    #http_method_override: true

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: null
        #cookie_samesite: lax

    #esi: true
    #fragments: true
    php_errors:
        log: true

pelso_open_api_validator_bundle:
    openapi_provider_list:
        - name: autoloaded_service
          service: 'App\OpenAPIProvider\AutoloadedProviderChecker'
        - name: manual_service
          service: '@app.provider.manual'
    openapi_yaml_list:
        - name: default
          uri: '%kernel.root_dir%/../src/Resources/basic_openapi_sample.yaml'
        - name: profile_demo
          uri: '%kernel.project_dir%/src/Resources/profile_openapi.yaml'
    profiles:
        - profile_name: strict
          provider_name: profile_demo
          error_actions:
              - '@pelso.openapi_validator_bundle.error_action.log'
              - '@pelso.openapi_validator_bundle.error_action.bad_request_response'
