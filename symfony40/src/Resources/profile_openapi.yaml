openapi: 3.0.0
info:
    title: Validator profile demo
    version: 1.0.0
paths:
    /check-profile:
        get:
            summary: Validate an integer query parameter using the strict profile.
            parameters:
                - in: query
                  name: id
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: The request passed profile validation.
                    content:
                        application/json:
                            schema:
                                type: object
                                required: [profile, id]
                                properties:
                                    profile:
                                        type: string
                                    id:
                                        type: integer
                '400':
                    description: The id parameter is missing or invalid.
